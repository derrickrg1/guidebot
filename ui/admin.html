<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AskNick Admin</title>
<link rel="icon" href="/logo.png?v=6">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500&family=Lato:ital,wght@0,400;0,700;0,900;1,400&display=swap">
<style>
/* Same theme as guidebot.html. */
:root {
  color-scheme: dark;
  --serif: Lato, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  --ink: #e6e8ea; --steel: #b3b9be; --mist: #7d878c; --rule: rgba(200, 204, 210, 0.1);
  --accent: #d9661f; --gold: #c8ccd2; --page: #131c1e; --side: rgba(0, 0, 0, 0.5);
  --card: rgba(0, 0, 0, 0.38); --warn: #e2b866; --warn-bg: rgba(226, 184, 102, 0.1); --bad: #e08080; --ok: #7cc48a;
}
html {
  background:
    radial-gradient(ellipse 70% 60% at 55% 35%, rgba(0, 0, 0, 0.15), rgba(0, 0, 0, 0.7) 75%, rgba(0, 0, 0, 0.88)),
    var(--page);
  background-attachment: fixed;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: transparent; color: var(--ink); display: flex;
  font: 14px/1.5 Lato, "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
aside { width: 300px; flex: none; background: var(--side); backdrop-filter: blur(18px); border-right: 1px solid var(--rule);
  padding: 20px 16px; overflow-y: auto; overflow-x: hidden; display: flex; flex-direction: column; gap: 14px; }
.brand { color: var(--gold); display: flex; align-items: center; gap: 12px; text-decoration: none; }
.brand img { width: 52px; height: 52px; margin: -10px -4px -2px -6px; filter: drop-shadow(0 3px 6px rgba(0, 0, 0, 0.5)); }
.brand .mark { display: block; font: 500 1.35rem/1 "Bodoni Moda", Didot, serif; letter-spacing: 0.04em; }
.brand .mark span { color: var(--accent); font: 600 0.55em Lato, "Segoe UI", "Helvetica Neue", Arial, sans-serif; vertical-align: 0.7em; margin-left: 1px; }
.brand .tag-line { display: block; margin-top: 5px; font: 0.56rem Lato, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  letter-spacing: 0.18em; color: var(--mist); }
.label { font: 600 0.68rem Lato, "Segoe UI", "Helvetica Neue", Arial, sans-serif; letter-spacing: 0.2em; color: var(--mist);
  text-transform: uppercase; }
.prog { margin-top: 4px; }
.prog > .label { display: block; margin: 8px 0 4px; }
.doc { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; cursor: pointer;
  padding: 7px 10px; margin-bottom: 4px; border: 1px solid var(--rule); border-radius: 8px;
  background: var(--card); color: var(--ink); font: inherit; font-size: 0.8rem; }
.doc:hover, .doc.on { border-color: var(--accent); }
.doc .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.dot.ok { background: var(--ok); } .dot.warn { background: var(--warn); } .dot.bad { background: var(--bad); }
.dot.off { background: var(--mist); }
.legend { font-size: 0.72rem; color: var(--mist); display: grid; gap: 3px; }
.legend span { display: flex; align-items: center; gap: 6px; }
main { flex: 1; overflow-y: auto; padding: 28px max(28px, calc((100% - 1200px) / 2)); }
h1 { font: 600 1.15rem/1.4 var(--serif); color: var(--accent); margin: 0 0 4px; }
h2 { font: 600 1rem var(--serif); margin: 0 0 8px; }
.sub { color: var(--steel); font: 1rem/1.6 var(--serif); margin-bottom: 18px; }
.panel { background: var(--card); border: 1px solid var(--rule); border-radius: 12px; padding: 16px 18px; margin-bottom: 16px;
  backdrop-filter: blur(12px); }
.note { padding: 10px 14px; border-radius: 8px; margin: 8px 0; font-size: 0.85rem; border: 1px solid var(--rule); }
.note.ok { color: var(--ok); background: rgba(124, 196, 138, 0.08); }
.note.warn { color: var(--warn); background: var(--warn-bg); }
.note.bad { color: var(--bad); background: rgba(224, 128, 128, 0.08); }
.note ul { margin: 6px 0 0; padding-left: 18px; }
button.act { font: 600 0.85rem Lato, "Segoe UI", "Helvetica Neue", Arial, sans-serif; padding: 9px 16px; border-radius: 999px; cursor: pointer;
  border: 1px solid var(--accent); background: var(--accent); color: #fff; }
button.act.ghost { background: transparent; color: var(--accent); }
button.act:disabled { opacity: 0.4; cursor: not-allowed; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
table { border-collapse: collapse; width: 100%; font-size: 0.78rem; }
th, td { border: 1px solid var(--rule); padding: 4px 6px; text-align: left; vertical-align: top; }
th { color: var(--steel); font-weight: 600; background: rgba(255, 255, 255, 0.03); }
td[contenteditable] { outline: none; }
td[contenteditable]:focus { background: rgba(217, 102, 31, 0.12); }
td.edited { background: rgba(226, 184, 102, 0.16); }
.scroll { overflow-x: auto; margin-bottom: 10px; }
.page { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.page img { width: 100%; border-radius: 6px; background: #fff; }
textarea { width: 100%; min-height: 280px; resize: vertical; background: rgba(0, 0, 0, 0.35); color: var(--ink);
  border: 1px solid var(--rule); border-radius: 8px; padding: 10px; font: 0.78rem/1.5 Consolas, monospace; }
.muted { color: var(--mist); font-size: 0.78rem; }
.empty { color: var(--steel); font: 1rem/1.65 var(--serif); margin-top: 18vh; text-align: center; }
label.toggle { display: flex; gap: 8px; align-items: center; font-size: 0.85rem; color: var(--steel); cursor: pointer; }
.tabs { display: flex; gap: 4px; padding: 4px; border: 1px solid var(--rule); border-radius: 999px; background: var(--card); }
.tabs button { flex: 1; padding: 6px 4px; border: 0; border-radius: 999px; background: none; color: var(--steel);
  font: 600 0.75rem Lato, "Segoe UI", "Helvetica Neue", Arial, sans-serif; cursor: pointer; }
.tabs button:hover { color: var(--ink); }
.tabs button.on { background: rgba(217, 102, 31, 0.16); color: var(--accent); }
#side { display: flex; flex-direction: column; gap: 10px; }
.doc.chat .muted { flex: none; font-size: 0.7rem; }
/* Chat transcripts read like AskNick: serif, question bubble on the right, answer card on the left. */
.convo { display: flex; flex-direction: column; gap: 16px; max-width: 820px; }
.msg { font: 400 1rem/1.65 var(--serif); }
.msg.user { align-self: flex-end; background: rgba(255, 255, 255, 0.07); padding: 10px 16px; border-radius: 16px;
  white-space: pre-wrap; max-width: min(620px, 85%); }
.msg.bot { background: var(--card); border: 1px solid var(--rule); border-radius: 4px 14px 14px 14px; padding: 12px 16px; }
.md > :first-child { margin-top: 0; } .md > :last-child { margin-bottom: 0; }
.md h1, .md h2, .md h3, .md h4 { color: var(--accent); font-size: 1rem; margin: 1em 0 0.4em; }
.md p { margin: 0.5em 0; } .md ul, .md ol { margin: 0.4em 0; padding-left: 1.4em; }
.md blockquote { margin: 4px 0 8px; padding: 4px 12px; border-left: 3px solid var(--gold); color: var(--steel); font-size: 0.9em; }
.md code { background: var(--side); padding: 1px 5px; border-radius: 4px; font-size: 0.88em; }
.md a { color: var(--gold); }
.md a.cite {
  display: inline-block; margin: 0 2px; padding: 0 7px; border: 1px solid var(--rule); border-radius: 999px;
  background: rgba(255, 255, 255, 0.05); color: var(--mist); font: 500 0.66rem/1.6 Lato, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  text-decoration: none; white-space: nowrap; vertical-align: 0.12em;
}
.md a.cite:hover { color: var(--accent); border-color: rgba(217, 102, 31, 0.5); }
.md li + li { margin-top: 0.45em; }
.tbl { overflow-x: auto; margin: 0.6em 0; }
/* Guideline feel: bold-only lines become ruled section labels, "Term: rule" bullets become a two-column
   sheet like the NDM matrices, the opening line reads as the summary. Tables are left as they were. */
.md > p:first-child:not(:only-child) { color: var(--ink); padding-bottom: 0.7em; border-bottom: 1px solid var(--rule); }
.md .sec { display: flex; align-items: center; gap: 10px; margin: 1.3em 0 0.5em; color: var(--accent);
  font: 600 0.78rem/1.3 Lato, "Segoe UI", "Helvetica Neue", Arial, sans-serif; letter-spacing: 0.16em; text-transform: uppercase; }
.md .sec::after { content: ""; flex: 1; border-top: 1px solid var(--rule); }
.md ul { list-style: square; }
.md li::marker { color: var(--accent); }
.md ul:has(> li.row) { list-style: none; padding-left: 0; border-bottom: 1px solid var(--rule); }
.md li.row { display: grid; grid-template-columns: minmax(7.5em, 32%) 1fr; grid-template-rows: auto 1fr; gap: 2px 18px; margin: 0;
  padding: 9px 0; border-top: 1px solid var(--rule); }
.md li.row + li.row { margin-top: 0; }
.md li.row > .term { grid-row: span 2; font-weight: 600; color: var(--ink); }
.md li.row > .def, .md li.row > ul, .md li.row > ol { grid-column: 2; }
.md li.row > ul, .md li.row > ol { margin: 0.3em 0 0; padding-left: 1.1em; border: 0; }
.md li.row li + li { margin-top: 0.25em; }
.msg.bot { container-type: inline-size; }
@container (max-width: 520px) { .md li.row { grid-template-columns: 1fr; } .md li.row > * { grid-column: 1 !important; grid-row: auto !important; } }
.md table { width: auto; font-size: 0.88rem; }
/* Updates tab: one card per change to an agency guide */
.badge { display: inline-block; min-width: 16px; padding: 0 5px; margin-left: 4px; border-radius: 999px; background: var(--accent);
  color: #fff; font: 600 0.62rem/1.5 Lato, "Segoe UI", "Helvetica Neue", Arial, sans-serif; vertical-align: 0.1em; }
.upd { border-left: 3px solid var(--accent); } .upd.done { border-left-color: var(--rule); opacity: 0.75; }
.upd .head { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.upd .head h2 { flex: 1; margin: 0; min-width: 240px; }
.kind { font: 600 0.66rem Lato, "Segoe UI", "Helvetica Neue", Arial, sans-serif; letter-spacing: 0.16em; text-transform: uppercase; color: var(--warn); }
.lines { font-size: 0.8rem; margin: 6px 0 0; padding: 0; list-style: none; max-height: 320px; overflow-y: auto; }
.lines li { padding: 3px 0 3px 8px; border-top: 1px solid var(--rule); }
.lines li.add { border-left: 2px solid var(--ok); } .lines li.del { border-left: 2px solid var(--bad); color: var(--steel); text-decoration: line-through; }
.lines a { color: var(--mist); font-size: 0.72rem; margin-right: 6px; }
details summary { cursor: pointer; color: var(--steel); font-size: 0.82rem; margin-top: 8px; }
.src { font-size: 0.78rem; padding: 7px 10px; border: 1px solid var(--rule); border-radius: 8px; background: var(--card); }
.src b { display: block; font-size: 0.8rem; }
/* Documents list: folding sections, compact rows */
.filter { width: 100%; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--rule); background: var(--card);
  color: var(--ink); font: inherit; font-size: 0.8rem; }
.filter:focus { outline: none; border-color: var(--accent); }
.summary { font-size: 0.75rem; color: var(--mist); margin-top: -4px; }
.summary .warn { color: var(--warn); } .summary .bad { color: var(--bad); }
.sec-box { border: 1px solid var(--rule); border-radius: 10px; background: rgba(0, 0, 0, 0.18); padding: 4px 6px; }
.sec-box.needs { border-color: rgba(226, 184, 102, 0.4); padding: 8px 6px 4px; }
.sec-box.needs .label { color: var(--warn); margin: 0 4px 6px; display: block; }
.sec-box summary { display: flex; align-items: center; gap: 8px; padding: 6px 4px; margin: 0; list-style: none;
  font: 600 0.78rem Lato, "Segoe UI", Arial, sans-serif; letter-spacing: 0.14em; text-transform: uppercase; color: var(--steel); }
.sec-box summary::-webkit-details-marker { display: none; }
.sec-box summary::before { content: "▸"; color: var(--mist); font-size: 0.7rem; transition: transform 0.15s; }
.sec-box[open] summary::before { transform: rotate(90deg); }
.sec-box summary span:first-of-type { flex: 1; }
.sec-box .count { font-size: 0.7rem; color: var(--mist); letter-spacing: 0; }
.grp { font-size: 0.66rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--mist); margin: 8px 6px 3px; }
.doc.slim { padding: 4px 8px; margin-bottom: 2px; border-color: transparent; background: none; font-size: 0.8rem; }
.doc.slim:hover { background: rgba(255, 255, 255, 0.04); border-color: var(--rule); }
.doc.slim.on { border-color: var(--accent); background: rgba(217, 102, 31, 0.08); }
.tag { font-size: 0.62rem; padding: 0 6px; border-radius: 999px; border: 1px solid var(--rule); color: var(--warn); }
.tag.ok { color: var(--mist); }
.claude { margin-top: auto; flex: none; }
.claude b .dot { display: inline-block; margin-right: 6px; vertical-align: 1px; }
.claude > div { margin-top: 4px; font-size: 0.78rem; }
.warn-text { color: var(--warn); }
button.act.small { padding: 5px 12px; font-size: 0.75rem; }
/* Overview */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 16px; }
.tile { display: flex; flex-direction: column; gap: 4px; text-align: left; padding: 14px 16px; border-radius: 12px;
  border: 1px solid var(--rule); background: var(--card); color: var(--ink); font: inherit; }
.tile[data-go] { cursor: pointer; } .tile[data-go]:hover { border-color: var(--accent); }
.tile .big { font: 700 1.6rem/1.1 Lato, "Segoe UI", Arial, sans-serif; }
.tile.ok .big { color: var(--ok); } .tile.warn .big { color: var(--warn); }
.board { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; align-items: start; }
.board .panel { margin-bottom: 0; padding: 12px 10px; }
.board h2 { padding: 0 6px; }
.home-btn { align-self: flex-start; }
.fb-line { padding: 8px 0; border-top: 1px solid var(--rule); font-size: 0.85rem; }
.fb-line:first-of-type { border-top: 0; }
@media (max-width: 900px) {
  body { flex-direction: column; } aside { width: auto; max-height: 40vh; } .page { grid-template-columns: 1fr; }
  main { padding: 20px 16px; }
}
</style>
</head>
<body>
<aside>
  <a class="brand" href="/"><img src="/logo.png?v=6" alt="">
    <div><span class="mark">ASKNICK<span>++</span></span><span class="tag-line">(ADMIN CONSOLE)</span></div></a>
  <nav class="tabs" role="tablist">
    <button type="button" data-tab="docs" class="on">Documents</button>
    <button type="button" data-tab="chats">Chats</button>
    <button type="button" data-tab="feedback">Feedback</button>
    <button type="button" data-tab="index">Index</button>
    <button type="button" data-tab="updates">Updates<span class="badge" id="upd-count" hidden></span></button>
  </nav>
  <div id="side"><div class="muted">Loading…</div></div>
  <div id="claude-card" class="src claude"></div>
</aside>
<main id="main"></main>
<script src="/md.js"></script>
<script>
const API = "";   // md.js links PDFs relative to this
const qs = o => new URLSearchParams(o).toString();
let tab = "docs", chatOpen = null;
const EMPTY = {
  docs: "Pick a document on the left to check it against the PDF and approve it.",
  chats: "Pick a chat on the left to read it.",
};

function showTab(t) {
  tab = t;
  document.querySelectorAll(".tabs button").forEach(b => b.classList.toggle("on", b.dataset.tab === t));
  document.getElementById("side").innerHTML = `<div class="muted">Loading…</div>`;
  if (t === "docs") { current ? render() : home(); loadList(); }
  if (t === "chats") { chatOpen = null; setMain(`<div class="empty">${EMPTY.chats}</div>`); loadChats(); }
  if (t === "index") indexTab();
  if (t === "updates") updatesTab();
  if (t === "feedback") feedbackTab();
}
document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => showTab(b.dataset.tab));
const setMain = html => { document.getElementById("main").innerHTML = html; };

// ---------- feedback: "This is wrong" reports, newest first. Each one is also a stress test case. ----------
async function feedbackTab() {
  const r = await fetch("/admin/api/feedback");
  const side = document.getElementById("side");
  if (!r.ok) { side.innerHTML = `<div class="note bad">Admin only.</div>`; return; }
  const {feedback} = await r.json();
  side.innerHTML = `<div class="muted">${feedback.length} report${feedback.length === 1 ? "" : "s"}. Each one runs in the
    stress test (tools.stress_run fb-), so once it's fixed it stays fixed.</div>`;
  setMain(feedback.length ? `<h1>Feedback</h1>` + feedback.map(f => `<div class="panel" style="margin-bottom:14px">
      <div class="sub">${esc(f.email === "local" ? "This PC" : f.email)} · ${new Date(f.ts * 1000).toLocaleString()} ·
        ${esc(f.mode === "scenario" ? "Scenario" : "Guidelines")} · ${esc(f.program || f.section || "All programs")} · fb-${f.id}</div>
      <div class="msg user">${esc(f.question)}</div>
      <div class="note bad"><strong>What's wrong:</strong> ${esc(f.note)}</div>
      <details><summary>The answer they got</summary><div class="msg bot md">${md(f.answer)}</div></details></div>`).join("")
    : `<div class="empty">No reports yet. People see a "This is wrong" link under every answer.</div>`);
}

// ---------- chats: everyone's, newest first, grouped by person ----------
async function loadChats() {
  const r = await fetch("/admin/api/chats");
  const side = document.getElementById("side");
  if (!r.ok) { side.innerHTML = `<div class="note bad">Admin only.</div>`; return; }
  const {chats} = await r.json();
  if (!chats.length) { side.innerHTML = `<div class="muted">No chats yet.</div>`; return; }
  const people = {};
  chats.forEach(c => (people[c.email] ||= []).push(c));
  side.innerHTML = Object.entries(people).map(([email, list]) =>
    `<div class="prog"><span class="label">${esc(email === "local" ? "This PC" : email)} · ${list.length}</span>` +
    list.map(c => `<button class="doc chat${c.id === chatOpen ? " on" : ""}" data-id="${esc(c.id)}" title="${esc(c.title)}">
      <span class="name">${esc(c.title)}</span><span class="muted">${new Date(c.updated * 1000).toLocaleDateString()}</span></button>`).join("")
    + `</div>`).join("");
  side.querySelectorAll(".chat").forEach(b => b.onclick = () => openChat(b.dataset.id));
}
async function openChat(id) {
  chatOpen = id;
  document.querySelectorAll("#side .chat").forEach(b => b.classList.toggle("on", b.dataset.id === id));
  const r = await fetch("/admin/api/chat?" + qs({id}));
  if (!r.ok) return setMain(`<div class="note bad">Couldn't load that chat.</div>`);
  const c = await r.json();
  setMain(`<h1>${esc(c.title)}</h1><div class="sub">${esc(c.email === "local" ? "This PC" : c.email)} ·
      ${c.mode === "scenario" ? "Scenario" : "Guidelines"} · ${esc(c.program || "All programs")} ·
      ${new Date(c.created * 1000).toLocaleString()}</div>
    <div class="convo">${c.messages.map(m => m.role === "user"
      ? `<div class="msg user">${esc(m.content)}</div>` : `<div class="msg bot md">${md(m.content)}</div>`).join("")}</div>`);
}

// ---------- index ----------
function indexTab() {
  document.getElementById("side").innerHTML = `<div class="muted">The search index feeds "All programs" questions and long
    guides like NonQM Shared. Matrix lookups and single-program answers don't need it.</div>`;
  setMain(`<h1>Search index</h1><div class="sub">Run this after you approve or fix a document's text. It only re-reads
      documents that changed.</div>
    <div class="panel"><div class="row"><button class="act" id="reindex">Update index</button></div>
      <div id="index-log" class="md" style="margin-top:12px"></div></div>`);
  document.getElementById("reindex").onclick = runIndex;
}
async function runIndex() {
  const btn = document.getElementById("reindex"), out = document.getElementById("index-log");
  btn.disabled = true;
  out.innerHTML = `<div class="muted">Checking documents…</div>`;
  try {
    const r = await fetch("/admin/api/index", {method: "POST", headers: {"Content-Type": "application/json", "X-Admin": "1"}, body: "{}"});
    if (!r.ok) throw new Error(r.status === 403 ? "Admin only." : `Error ${r.status}`);
    const reader = r.body.getReader(), dec = new TextDecoder();
    let buf = "";
    for (;;) {
      const {value, done} = await reader.read();
      if (done) break;
      buf += dec.decode(value, {stream: true});
      let nl;
      while ((nl = buf.indexOf("\n")) >= 0) {
        const ev = JSON.parse(buf.slice(0, nl)); buf = buf.slice(nl + 1);
        if (ev.error) throw new Error(ev.error);
        if (ev.status) out.innerHTML = `<div class="muted">${esc(ev.status)}</div>`;
        if (ev.replace) out.innerHTML = md(ev.replace);
      }
    }
  } catch (e) { out.innerHTML = `<div class="note bad">${esc(e.message)}</div>`; }
  btn.disabled = false;
}
// ---------- updates: agency guides (HUD, VA, Fannie) checked weekly by the server ----------
const ago = t => t ? new Date(t * 1000).toLocaleString() : "never";
async function agencyState() {
  const r = await fetch("/admin/api/agency");
  if (!r.ok) return null;
  const a = await r.json(), badge = document.getElementById("upd-count");
  badge.textContent = a.open; badge.hidden = !a.open;
  return a;
}
const pdfLink = (file, page) => `/pdf/${encodeURIComponent(file.split("/").pop())}${page ? "#page=" + page : ""}`;
function updateCard(u) {
  const d = u.diff, name = u.file.split("/").pop();
  const what = u.kind === "new" ? `Added, ${u.pages} pages` : u.kind === "removed" ? "No longer listed by the agency, moved to the archive"
    : d ? `${d.added} lines added, ${d.removed} removed, on ${d.pages.length} page${d.pages.length === 1 ? "" : "s"}` : "Changed";
  const lines = d ? [...d.added_lines.map(([p, l]) => `<li class="add"><a href="${pdfLink(u.file, p)}" target="_blank">p. ${p}</a>${esc(l)}</li>`),
                     ...d.removed_lines.map(([p, l]) => `<li class="del"><a>old p. ${p}</a>${esc(l)}</li>`)] : [];
  return `<div class="panel upd${u.reviewed ? " done" : ""}"><div class="head"><span class="kind">${esc(u.kind)}</span>
      <h2>${esc(u.title)}</h2><span class="muted">${esc(u.date)}</span></div>
    <div class="sub" style="margin:6px 0 0;font-size:0.9rem">${esc(what)}${u.kind !== "removed" ? ` · <a href="${pdfLink(u.file)}" target="_blank">${esc(name)}</a>` : ""}</div>
    ${lines.length ? `<details${u.reviewed ? "" : " open"}><summary>What changed${d.added + d.removed > lines.length ? ` (first ${lines.length} lines)` : ""}</summary>
      <ul class="lines">${lines.join("")}</ul></details>` : ""}
    ${u.reviewed ? `<div class="muted" style="margin-top:8px">Reviewed</div>` : `<div class="row" style="margin-top:10px">
      <button class="act ghost" data-review="${esc(u.id)}">Mark reviewed</button></div>`}</div>`;
}
async function updatesTab() {

  if (tab !== "updates") return;
  if (!a) { document.getElementById("side").innerHTML = `<div class="note bad">Admin only.</div>`; return; }
  document.getElementById("side").innerHTML = `<div class="muted">The agency guides under NDM's FHA, VA and Conventional
      sheets. The server checks them once a week and answers from new text right away, marked "not yet reviewed".</div>` +
    a.sources.map(s => `<div class="src"><b>${esc(s.name)}</b>${s.files} file${s.files === 1 ? "" : "s"} · checked ${esc(ago(s.checked))}

      ${s.error ? `<div class="note bad">${esc(s.error)}</div>` : ""}</div>`).join("");

      ${a.open ? `${a.open} to review.` : "Nothing to review."}</div>
    <div class="panel"><div class="row"><button class="act" id="agency-check" ${a.running ? "disabled" : ""}>${a.running ? "Checking…" : "Check now"}</button>
      ${a.open > 1 ? `<button class="act ghost" id="review-all">Mark all ${a.open} reviewed</button>` : ""}</div>
      <div id="agency-log" class="md" style="margin-top:12px"></div></div>
    ${a.notices.map(n => `<div class="note warn">New <b>${esc(n.title)}</b> published ${esc(n.version)}.
      <a href="${esc(n.url)}" target="_blank" rel="noopener">Download it</a> and save it in
      <code>agency/${esc(n.folder)}/</code> (replace the old one). The next check reads it.</div>`).join("")}
    ${open.map(updateCard).join("")}
    ${done.length ? `<details><summary>${done.length} reviewed</summary>${done.slice(0, 40).map(updateCard).join("")}</details>` : ""}`);
  document.getElementById("agency-check").onclick = runAgencyCheck;
  const all = document.getElementById("review-all");
  if (all) all.onclick = async () => {
    if (!confirm(`Mark all ${a.open} updates reviewed? Answers stop saying "not yet reviewed" for these guides.`)) return;

    if (res.error) alert(res.error); else updatesTab();
  };

async function runAgencyCheck() {
  const btn = document.getElementById("agency-check"), out = document.getElementById("agency-log");
  btn.disabled = true; btn.textContent = "Checking…";
  out.innerHTML = `<div class="muted">Checking HUD, VA and Fannie Mae… a big download can take a while.</div>`;
  try {
    const r = await fetch("/admin/api/agency/check", {method: "POST", headers: {"Content-Type": "application/json", "X-Admin": "1"}, body: "{}"});
    if (!r.ok) throw new Error(r.status === 403 ? "Admin only." : `Error ${r.status}`);
    const reader = r.body.getReader(), dec = new TextDecoder();
    let buf = "", last = "";
    for (;;) {
      const {value, done} = await reader.read();
      if (done) break;
      buf += dec.decode(value, {stream: true});
      let nl;
      while ((nl = buf.indexOf("\n")) >= 0) {
        const ev = JSON.parse(buf.slice(0, nl)); buf = buf.slice(nl + 1);
        if (ev.error) throw new Error(ev.error);
        if (ev.status) out.innerHTML = `<div class="muted">${esc(ev.status)}</div>`;
        if (ev.replace) last = ev.replace;
      }
    }
    if (tab === "updates") { await updatesTab(); document.getElementById("agency-log").innerHTML = md(last); }
  } catch (e) { out.innerHTML = `<div class="note bad">${esc(e.message)}</div>`; btn.disabled = false; btn.textContent = "Check now"; }
}

let current = null;   // {program, file, fresh, data}

function docDot(d) {
  if (d.status === "verified" && d.problems) return "bad";
  if (d.status !== "verified" || (d.rules && d.rules.status !== "approved")) return "warn";
  return "ok";
}

// Documents grouped the way the chat's tabs are: NonQM (Express / Ignite / Shared), Conventional (Fannie / Freddie),
// FHA, VA. Each section folds; anything that needs you is listed first and opens its section.
const FREDDIE = ["Freddie Mac", "Home Possible", "Home Possible VLIP", "HomeOne", "Refi Possible"];
function place(program) {
  if (program.startsWith("Conventional ")) {
    const name = program.slice(13);
    return ["Conventional", FREDDIE.includes(name) ? "Freddie Mac" : "Fannie Mae", name];
  }
  for (const s of ["FHA", "VA"]) if (program.startsWith(s + " ")) return [s, "", program.slice(s.length + 1)];
  const [fam, ...rest] = program.split(" ");
  if (fam === "Express" || fam === "Ignite") return ["NonQM", fam, rest.join(" ")];
  return ["NonQM", "Shared", program.replace(/^NonQM /, "")];
}
const SECTION_ORDER = ["NonQM", "Conventional", "FHA", "VA"];
const DOT_WORD = {ok: "Approved", warn: "Needs you", bad: "Blocked"};
const openSecs = (() => { try { return JSON.parse(localStorage.getItem("asknick.admin.open") || "[]"); } catch (e) { return []; } })();
const saveOpen = () => { try { localStorage.setItem("asknick.admin.open", JSON.stringify(openSecs)); } catch (e) {} };
let docFilter = "";

function docRow(p, d, label) {
  const on = current && current.program === p.program && current.file === d.file;
  return `<button class="doc slim${on ? " on" : ""}" data-program="${esc(p.program)}" data-file="${esc(d.file)}"
      title="${esc(p.program)}: ${esc(d.file)} (${DOT_WORD[docDot(d)]})">
    <i class="dot ${docDot(d)}"></i><span class="name">${esc(label)}</span>
    ${d.rules ? `<span class="tag${d.rules.status === "approved" ? " ok" : ""}">rules</span>` : ""}</button>`;
}

let overview = null;
async function loadList(cached) {
  const box = document.getElementById("side");
  if (!cached || !overview) {
    const r = await fetch("/admin/api/overview");
    if (tab !== "docs") return;
    if (!r.ok) { box.innerHTML = `<div class="note bad">Admin only.</div>`; return; }
    overview = (await r.json()).programs;
  }
  const programs = overview;
  const rows = [];   // one per document: section, group, label
  programs.forEach(p => {
    const [sec, group, name] = place(p.program);
    p.docs.forEach(d => rows.push({p, d, sec, group,
      label: p.docs.length > 1 ? `${name} · ${d.file.replace(/\.pdf$/i, "").replace(/[-_]/g, " ")}` : name}));
  });
  const f = docFilter.toLowerCase();
  const shown = rows.filter(x => !f || `${x.p.program} ${x.d.file}`.toLowerCase().includes(f));
  const need = shown.filter(x => docDot(x.d) !== "ok");
  const counts = {ok: 0, warn: 0, bad: 0};
  rows.forEach(x => counts[docDot(x.d)]++);
  let html = `${current ? `<button class="act ghost small home-btn" id="go-home">← Overview</button>` : ""}
    <input id="doc-filter" class="filter" placeholder="Filter documents" value="${esc(docFilter)}">
    <div class="summary">${counts.ok} approved${counts.warn ? ` · <b class="warn">${counts.warn} need you</b>` : ""}${counts.bad ? ` · <b class="bad">${counts.bad} blocked</b>` : ""}</div>`;
  if (need.length) html += `<div class="sec-box needs"><div class="label">Needs you</div>${need.map(x => docRow(x.p, x.d, `${x.sec} · ${x.label}`)).join("")}</div>`;
  for (const sec of SECTION_ORDER) {
    const list = shown.filter(x => x.sec === sec);
    if (!list.length) continue;
    const bad = list.filter(x => docDot(x.d) !== "ok").length;
    const isOpen = f || openSecs.includes(sec) || list.some(x => current && current.program === x.p.program);
    const groups = [...new Set(list.map(x => x.group))];
    html += `<details class="sec-box" data-sec="${sec}"${isOpen ? " open" : ""}><summary><span>${sec}</span>
        <span class="count">${list.length}</span>${bad ? `<i class="dot warn"></i>` : `<i class="dot ok"></i>`}</summary>` +
      groups.map(g => (g ? `<div class="grp">${esc(g)}</div>` : "") +
        list.filter(x => x.group === g).map(x => docRow(x.p, x.d, x.label)).join("")).join("") + `</details>`;
  }
  box.innerHTML = html;
  box.querySelectorAll(".doc").forEach(b => b.onclick = () => openDoc(b.dataset.program, b.dataset.file, false));
  const back = document.getElementById("go-home");
  if (back) back.onclick = () => { current = null; home(); loadList(true); };
  box.querySelectorAll("details.sec-box").forEach(d => d.ontoggle = () => {
    const i = openSecs.indexOf(d.dataset.sec);
    if (d.open && i < 0) openSecs.push(d.dataset.sec);
    if (!d.open && i >= 0) openSecs.splice(i, 1);
    saveOpen();
  });
  const input = document.getElementById("doc-filter");
  input.oninput = () => { docFilter = input.value; loadList(true).then(() => {
    const again = document.getElementById("doc-filter"); again.focus(); again.setSelectionRange(docFilter.length, docFilter.length); }); };
}

// ---------- overview: what the right side shows with no document open ----------
const getJson = async url => { try { const r = await fetch(url); return r.ok ? await r.json() : null; } catch (e) { return null; } };

      ${tile("Documents", `${rows.length - need.length}/${rows.length}`, need.length ? `${need.length} need you` : "all approved", need.length ? "warn" : "ok")}
      ${claude ? tile("Claude", claude.out ? "Out" : claude.balance != null ? `~$${claude.balance.toFixed(2)}` : "On",
          claude.out ? `local model answering · next check ${esc(hour(claude.next_check))}` : `${esc(name)} · $${claude.spent.toFixed(2)} spent`, claude.out ? "warn" : "ok") : ""}
      ${ag ? tile("Agency updates", ag.open, ag.open ? "to review" : "nothing new", ag.open ? "warn" : "ok", "updates") : ""}
      ${fb ? tile("Feedback", fb.feedback.length, "“This is wrong” reports", fb.feedback.length ? "warn" : "ok", "feedback") : ""}
      ${ch ? tile("Chats", ch.chats.length, `${people} ${people === 1 ? "person" : "people"} · ${week} this week`, "", "chats") : ""}
    </div>
    ${need.length ? `<div class="panel"><h2>Needs you</h2>${need.map(x => `<button class="doc slim" data-program="${esc(x.p.program)}" data-file="${esc(x.d.file)}">
      <i class="dot ${docDot(x.d)}"></i><span class="name">${esc(x.sec)} · ${esc(x.name)}</span></button>`).join("")}</div>` : ""}
    <div class="board">${SECTION_ORDER.map(sec => { const list = rows.filter(x => x.sec === sec);
      return `<div class="panel col"><h2>${sec} <span class="muted">${list.length}</span></h2>` +
        [...new Set(list.map(x => x.group))].map(g => (g ? `<div class="grp">${esc(g)}</div>` : "") +
          list.filter(x => x.group === g).map(x => `<button class="doc slim" data-program="${esc(x.p.program)}" data-file="${esc(x.d.file)}" title="${esc(x.d.file)}">
            <i class="dot ${docDot(x.d)}"></i><span class="name">${esc(x.name)}</span>
            ${x.d.rules ? `<span class="tag${x.d.rules.status === "approved" ? " ok" : ""}">rules</span>` : ""}</button>`).join("")).join("") + `</div>`; }).join("")}</div>
    ${fb && fb.feedback.length ? `<div class="panel"><h2>Latest feedback</h2>${fb.feedback.slice(0, 3).map(f => `<div class="fb-line">
      <span class="muted">${new Date(f.ts * 1000).toLocaleDateString()} · ${esc(f.email === "local" ? "This PC" : f.email)}</span>
      <div>${esc(f.question)}</div><div class="warn-text">${esc(f.note)}</div></div>`).join("")}</div>` : ""}`);
  document.querySelectorAll("#main .doc").forEach(b => b.onclick = () => openDoc(b.dataset.program, b.dataset.file, false));
  document.querySelectorAll("#main [data-go]").forEach(b => b.onclick = () => showTab(b.dataset.go));

async function openDoc(program, file, fresh) {
  const main = document.getElementById("main");
  main.innerHTML = `<div class="empty">${fresh ? "Re-reading the PDF…" : "Loading…"}</div>`;
  const r = await fetch("/admin/api/doc?" + qs({program, file, fresh: fresh ? 1 : 0}));
  if (!r.ok) { main.innerHTML = `<div class="note bad">Couldn't load ${esc(file)}.</div>`; return; }
  current = {program, file, fresh, data: await r.json()};
  render();
  loadList();
}

function rulesPanel(d) {
  const R = d.rules;
  if (!R) return "";
  const label = {approved: "approved", unapproved: "not approved yet", changed: "changed since approval",
                 bad_quotes: "quotes not found in the PDF"}[R.status];
  const canApprove = d.status === "verified" && !R.bad_quotes.length && R.status !== "approved";
  return `<div class="panel"><h2>Overlay rules: ${R.rows.length} rules, ${label}</h2>
    <div class="muted">Python applies these to deal answers instead of the AI. Check each one against the PDF:
      when it applies, what it does, and the quote. Facts the user doesn't mention are never assumed.</div>
    ${R.bad_quotes.length ? `<div class="note bad">These quotes aren't in the document word for word: ${esc(R.bad_quotes.join(", "))}</div>` : ""}
    ${d.status !== "verified" ? `<div class="note warn">Approve the document itself first. Rule quotes are checked against its approved text.</div>` : ""}
    <div class="scroll" style="margin-top:10px"><table><tr><th>Overlay</th><th>Applies when</th><th>Effect</th><th>Quote</th><th>Page</th></tr>
      ${R.rows.map(x => `<tr><td>${esc(x.label)}</td><td>${esc(x.when)}</td><td>${esc(x.effect)}</td><td>${esc(x.quote)}</td><td>${esc(x.page)}</td></tr>`).join("")}
    </table></div>
    <div class="muted">${esc(R.built_by)}</div>
    ${R.status === "approved" ? `<div class="note ok">Approved.</div>` :
      `<div class="row" style="margin-top:12px"><button class="act" id="approve-rules" ${canApprove ? "" : "disabled"}>Approve these overlay rules</button></div>`}
  </div>`;
}

function render() {
  const d = current.data;
  const main = document.getElementById("main");
  const reviewing = d.status !== "verified" || d.fresh || current.reviewing;
  let head = `<h1>${esc(d.file)}</h1><div class="sub">${esc(d.program)}</div>`;
  if (d.status === "verified" && d.saved_problems.length)
    head += `<div class="note bad">Approved, but its matrices have problems. No numbers come from it until you re-verify.<ul>${d.saved_problems.map(p => `<li>${esc(p)}</li>`).join("")}</ul></div>`;
  else if (d.status === "verified") head += `<div class="note ok">✓ Verified.</div>`;
  else if (d.status === "changed") head += `<div class="note warn">The file changed since you approved it. Re-check and approve again.</div>`;
  else head += `<div class="note warn">Not verified yet.</div>`;

  let body = rulesPanel(d);
  if (!reviewing) {
    body += `<div class="row"><button class="act ${d.saved_problems.length ? "" : "ghost"}" id="reverify">Re-verify</button></div>`;
    main.innerHTML = head + body;
  } else {
    if (d.status === "verified")
      body += `<label class="toggle"><input type="checkbox" id="fresh" ${d.fresh ? "checked" : ""}>
        Re-read the PDF with the current parser (drops edits you made last time)</label><br>`;
    body += d.pages.map(p => `<div class="panel"><h2>Page ${p.page}</h2><div class="page">
      <div>${d.is_pdf ? `<img loading="lazy" alt="Page ${p.page}" src="/admin/page.png?${qs({program: d.program, file: d.file, page: p.page})}">` : ""}</div>
      <div>${p.matrices.map((m, i) => matrixHtml(p.page, i, m)).join("")}
        <div class="label" style="margin:6px 0">Text the bot reads</div>
        <textarea data-page="${p.page}">${esc(p.text)}</textarea></div></div></div>`).join("");
    body += `<div class="panel">${d.blocked.length ? `<div class="note bad">Can't approve yet:<ul>${d.blocked.slice(0, 10).map(b => `<li>${esc(b)}</li>`).join("")}</ul>
        A wrong cell can be fixed in the table. Wrong headers need a parser fix.</div>` : ""}
      <div class="row"><button class="act" id="approve-doc">Approve this document</button>
      <span class="muted">Edited cells are highlighted. Problems are checked again when you approve.</span></div>
      <div id="doc-msg"></div></div>`;
    main.innerHTML = head + body;
    main.querySelectorAll("td[contenteditable]").forEach(td => td.oninput = () =>
      td.classList.toggle("edited", td.textContent !== td.dataset.orig));
    const fr = document.getElementById("fresh");
    if (fr) fr.onchange = () => openDoc(d.program, d.file, fr.checked);
    document.getElementById("approve-doc").onclick = approveDoc;
  }
  const rv = document.getElementById("reverify");
  if (rv) rv.onclick = () => d.saved_problems.length ? openDoc(d.program, d.file, true) : (current.reviewing = true, render());
  const ar = document.getElementById("approve-rules");
  if (ar) ar.onclick = approveRules;
}

function matrixHtml(page, i, m) {
  const cc = m.crosscheck;
  const check = cc.status === "match" ? `<div class="note ok">Matches the Revo site's copy cell for cell (${esc(cc.source)}).</div>`
    : cc.status === "mismatch" ? `<div class="note bad">Differs from the Revo site's copy (${esc(cc.source)}):<ul>${cc.diffs.slice(0, 8).map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>`
    : `<div class="muted">No Revo site copy to cross-check. Check every cell by eye.</div>`;
  return `<div class="label" style="margin-bottom:4px">Matrix: ${esc(m.title)}</div>
    ${m.problems.map(p => `<div class="note bad">${esc(p)}</div>`).join("")}${check}
    <div class="scroll"><table data-page="${page}" data-matrix="${i}">
      <tr>${m.columns.map(c => `<th>${esc(c)}</th>`).join("")}</tr>
      ${m.rows.map(r => `<tr>${r.map(v => `<td contenteditable="plaintext-only" data-orig="${esc(v)}">${esc(v)}</td>`).join("")}</tr>`).join("")}
    </table></div>`;
}

async function post(url, payload) {
  const r = await fetch(url, {method: "POST", headers: {"Content-Type": "application/json", "X-Admin": "1"},
                              body: JSON.stringify(payload)});
  return r.ok ? r.json() : {error: r.status === 403 ? "Admin only." : `Error ${r.status}`};
}

async function approveDoc() {
  const d = current.data, main = document.getElementById("main");
  const edits = d.pages.map(p => ({
    page: p.page,
    text: main.querySelector(`textarea[data-page="${p.page}"]`).value,
    matrices: p.matrices.map((_, i) => [...main.querySelectorAll(`table[data-page="${p.page}"][data-matrix="${i}"] tr`)]
      .slice(1).map(tr => [...tr.children].map(td => td.textContent))),
  }));
  const btn = document.getElementById("approve-doc");
  btn.disabled = true;
  const res = await post("/admin/api/approve-doc", {program: d.program, file: d.file, fresh: d.fresh, edits});
  if (res.ok) return openDoc(d.program, d.file, false);
  btn.disabled = false;
  document.getElementById("doc-msg").innerHTML = `<div class="note bad">${esc(res.error)}${res.blocked ?
    `<ul>${res.blocked.slice(0, 10).map(b => `<li>${esc(b)}</li>`).join("")}</ul>` : ""}</div>`;
}

async function approveRules() {
  const d = current.data;
  document.getElementById("approve-rules").disabled = true;
  const res = await post("/admin/api/approve-rules", {program: d.program, file: d.file});
  if (!res.ok) alert(res.error);
  openDoc(d.program, d.file, false);
}

// ---------- Claude credit: out means every answer comes from the local model until a check gets through ----------

async function claudeCard() {
  const box = document.getElementById("claude-card");

  box.innerHTML = `<b><i class="dot ${c.out ? "warn" : "ok"}"></i>${esc(name)}</b>

      <div class="muted">Next automatic check ${esc(hour(c.next_check))} (checks 9 AM, 12 PM, 3 PM).</div>`
      : `<div>${c.balance != null ? `About <b>$${c.balance.toFixed(2)}</b> credit left` : "Credit left: not set"}</div>`}
    <div class="muted">${c.balance != null || c.spent ? `Estimate: amount you entered less each answer's cost ($${c.spent.toFixed(2)} spent so far).` : "Enter what you added so the estimate can count down."}
      ${c.last_check ? `<br>Last check ${esc(hour(c.last_check))}: ${esc(c.last_result)}` : ""}</div>
    <div class="row" style="margin-top:8px"><button class="act small" id="claude-check">Check now</button>
      <button class="act ghost small" id="claude-added">I added credit</button></div>`;
  document.getElementById("claude-check").onclick = async e => {
    e.target.disabled = true; e.target.textContent = "Checking…";
    const res = await post("/admin/api/claude/check", {});
    if (res.error) alert(res.error);
    claudeCard();
  };
  document.getElementById("claude-added").onclick = async () => {
    const v = prompt("How much credit does the Claude Console show now? (dollars)");
    if (v === null) return;
    const amount = parseFloat(v.replace(/[$,\s]/g, ""));
    if (!(amount >= 0)) return alert("That isn't a dollar amount.");
    await post("/admin/api/claude/balance", {amount});
    await post("/admin/api/claude/check", {});   // and turn Claude back on if the credit went through
    claudeCard();
  };
}

showTab("docs");
agencyState();
claudeCard();
</script>
</body>
</html>
