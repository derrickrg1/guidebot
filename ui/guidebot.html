<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AskNick</title>
<link rel="icon" type="image/png" href="logo.png">
<!-- Closest free match to Claude's type: serif for answers, clean sans for the interface. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500&family=Space+Mono&family=Barlow+Condensed:wght@600&family=Inter:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
/* One theme: Inked Japan black, silver from the tin rim, burnt orange accents (--navy is the accent slot). */
:root {
  color-scheme: dark;
  --serif: "Source Serif 4", Georgia, "Times New Roman", serif;
  --ink: #e6e8ea; --steel: #b3b9be; --mist: #7d878c; --rule: rgba(200, 204, 210, 0.1);
  --navy: #d9661f; --gold: #c8ccd2; --page: #131c1e; --side: rgba(0, 0, 0, 0.5);
  --card: rgba(0, 0, 0, 0.38); --user: rgba(217, 102, 31, 0.18); --user-ink: #f6ece4; --warn: #e2b866;
  --warn-bg: rgba(226, 184, 102, 0.1); --bad: #e08080; --ok: #7cc48a;
}
/* Black overlay over the paint: lit in the middle, falling off to black at the edges like the photo. */
html {
  background:
    radial-gradient(ellipse 70% 60% at 55% 35%, rgba(0, 0, 0, 0.15), rgba(0, 0, 0, 0.7) 75%, rgba(0, 0, 0, 0.88)),
    var(--page);
  background-attachment: fixed;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: transparent; color: var(--ink);
  font: 15px/1.55 "Inter", "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif;
  display: flex;
}
aside {
  width: 280px; flex: none; background: var(--side); backdrop-filter: blur(18px); border-right: 1px solid var(--rule);
  padding: 20px 18px; display: flex; flex-direction: column; gap: 14px; overflow-y: auto;
}
/* Wordmark styled after the Inked Japan paint label: Bodoni caps, a raised white ++, mono tagline in parentheses. */
.brand { color: var(--gold); display: flex; align-items: center; gap: 14px; }
.brand .mark { display: block; font: 500 1.6rem/1 "Bodoni Moda", Didot, "Bodoni MT", serif; letter-spacing: 0.04em; }
/* Bodoni's own + is a hairline that disappears at this size, so the ++ is drawn in Inter. */
.brand .mark span { color: var(--navy); font: 600 0.55em Inter, "Segoe UI", sans-serif; vertical-align: 0.7em; margin-left: 1px; letter-spacing: 0; }
.brand .tag-line { display: block; margin-top: 5px; font: 0.56rem "Space Mono", Consolas, monospace;
  letter-spacing: 0.18em; color: var(--mist); }
/* Round crop, silver ring like the tin rim. The crop also hides the corner watermark. */
.brand img { width: 48px; height: 48px; border-radius: 50%; border: 2px solid var(--gold);
  box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.6), 0 6px 18px rgba(0, 0, 0, 0.5); }
/* Two plain choices: what to do (mode tiles), and where (program list). */
.label { font: 600 0.68rem "Barlow Condensed", "Arial Narrow", sans-serif; letter-spacing: 0.2em; color: var(--mist); }
.modes { display: flex; flex-direction: column; gap: 6px; }
.modes label {
  display: block; padding: 9px 12px; border: 1px solid var(--rule); border-radius: 8px; cursor: pointer;
  background: var(--card); transition: border-color 0.15s, background 0.15s;
}
.modes input { position: absolute; opacity: 0; pointer-events: none; }
.modes b { display: block; font-weight: 600; font-size: 0.8rem; }
/* The one-line description only opens on hover (or keyboard focus). */
.modes small { display: block; color: var(--mist); font-size: 0.7rem; max-height: 0; opacity: 0; overflow: hidden;
  transition: max-height 0.2s, opacity 0.2s; }
.modes label:hover small, .modes label:has(input:focus-visible) small { max-height: 2em; opacity: 1; }
.modes label:hover { border-color: rgba(217, 102, 31, 0.4); }
.modes label:has(input:checked) { border-color: var(--navy); background: rgba(217, 102, 31, 0.1); }
.modes label:has(input:checked) b { color: var(--navy); }
.modes label:has(input:focus-visible) { outline: 2px solid var(--navy); outline-offset: 2px; }
.modes label.off { opacity: 0.45; cursor: default; }
.modes label.off:hover { border-color: var(--rule); }
select, button, textarea { font: inherit; color: inherit; }
select {
  width: 100%; padding: 8px 10px; border: 1px solid var(--rule); border-radius: 8px; background: var(--card);
}
select option { background: #131c1e; }
/* Program picker: a glass menu in place of the browser's own dropdown (the hidden <select> still holds the value). */
.picker-btn {
  width: 100%; display: flex; align-items: center; gap: 8px; padding: 9px 12px; text-align: left; cursor: pointer;
  border: 1px solid var(--rule); border-radius: 8px; background: var(--card); font-size: 0.85rem;
  transition: border-color 0.15s;
}
.picker-btn:hover, .picker-btn[aria-expanded=true] { border-color: rgba(217, 102, 31, 0.5); }
.picker-btn:focus-visible { outline: 2px solid var(--navy); outline-offset: 2px; }
.picker-val { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.picker-btn svg { width: 16px; height: 16px; color: var(--mist); flex: none; transition: transform 0.15s; }
.picker-btn[aria-expanded=true] svg { transform: rotate(180deg); }
.picker-menu {
  position: fixed; z-index: 50; overflow-y: auto; padding: 6px; border-radius: 12px;
  background: rgba(10, 14, 16, 0.94); backdrop-filter: blur(22px); border: 1px solid rgba(200, 204, 210, 0.14);
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.65); scrollbar-width: thin; scrollbar-color: rgba(200, 204, 210, 0.2) transparent;
}
.picker-group { font: 600 0.66rem "Barlow Condensed", "Arial Narrow", sans-serif; letter-spacing: 0.2em; color: var(--mist);
  text-transform: uppercase; padding: 12px 10px 4px; }
.picker-group:first-child { padding-top: 4px; }
.picker-opt { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-radius: 7px; font-size: 0.84rem; cursor: pointer;
  white-space: nowrap; }.picker-opt:hover, .picker-opt.active { background: rgba(255, 255, 255, 0.06); }
.picker-opt.sel { color: var(--navy); }
.picker-opt .ck { margin-left: auto; width: 14px; height: 14px; opacity: 0; }
.picker-opt.sel .ck { opacity: 1; }
.picker-opt.off { color: var(--mist); font-style: italic; cursor: default; }
.picker-opt.off:hover { background: none; }
.tag { font-size: 0.68rem; color: var(--mist); border: 1px solid var(--rule); border-radius: 999px; padding: 1px 7px; white-space: nowrap; }
.picker-opt.sel .tag { color: inherit; border-color: rgba(217, 102, 31, 0.4); }
/* Chat history */
.newchat {
  display: flex; align-items: center; justify-content: center; gap: 7px; width: 100%; padding: 8px 12px; cursor: pointer;
  border: 1px solid rgba(217, 102, 31, 0.45); border-radius: 999px; background: rgba(217, 102, 31, 0.08);
  color: var(--navy); font-weight: 600; font-size: 0.82rem; transition: background 0.15s;
}
.newchat:hover { background: rgba(217, 102, 31, 0.16); }
.newchat svg { width: 15px; height: 15px; }
.chats { display: flex; flex-direction: column; gap: 1px; min-height: 0; }
.chats .when { font: 600 0.62rem "Barlow Condensed", "Arial Narrow", sans-serif; letter-spacing: 0.2em; color: var(--mist);
  text-transform: uppercase; padding: 10px 8px 4px; }
.chat-item { display: flex; align-items: center; gap: 6px; padding: 6px 8px; border-radius: 7px; cursor: pointer;
  font-size: 0.8rem; color: var(--steel); }
.chat-item:hover { background: rgba(255, 255, 255, 0.05); color: var(--ink); }
.chat-item.on { background: rgba(217, 102, 31, 0.1); color: var(--ink); }
.chat-item .t { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chat-item .x { opacity: 0; border: 0; background: none; color: var(--mist); cursor: pointer; padding: 0 2px; font-size: 1rem; line-height: 1; }
.chat-item:hover .x { opacity: 1; }
.chat-item .x:hover { color: var(--bad); }
.docs { font-size: 0.78rem; color: var(--steel); display: flex; flex-direction: column; gap: 3px; word-break: break-word; }
.note { font-size: 0.78rem; padding: 8px 10px; border-radius: 6px; background: var(--warn-bg); color: var(--warn); }
.row { display: flex; gap: 8px; }
.btn {
  flex: 1; padding: 7px 10px; border: 1px solid var(--rule); background: var(--card); border-radius: 6px; cursor: pointer;
}
.btn:hover { border-color: var(--gold); }
.btn:disabled { opacity: 0.5; cursor: default; }
.foot { margin-top: auto; font-size: 0.7rem; color: var(--mist); }
hr { border: 0; border-top: 1px solid var(--rule); margin: 0; width: 100%; }

main { flex: 1; min-width: 0; display: flex; flex-direction: column; height: 100vh; }
header { padding: 20px max(32px, calc((100% - 780px) / 2)) 12px; border-bottom: 1px solid var(--rule); }
/* Main area reads like Claude: one serif at one size. The title only differs by weight and color. */
h1, .subtitle, .empty, .msg.bot { font: 400 1rem/1.65 var(--serif); letter-spacing: 0; }
h1 { margin: 0; color: var(--navy); font-weight: 600; }
.subtitle { color: var(--mist); }
#offline { display: none; margin-top: 10px; }
#offline code { background: var(--card); padding: 1px 5px; border-radius: 4px; }
/* Conversation and input share one centered column, like Claude's chat. */
#log { flex: 1; overflow-y: auto; padding: 24px max(32px, calc((100% - 780px) / 2)); display: flex; flex-direction: column; gap: 18px; }
.empty { color: var(--mist); max-width: 560px; }
.msg.user {
  align-self: flex-end; background: rgba(255, 255, 255, 0.07); color: var(--ink); padding: 10px 16px;
  border-radius: 16px; white-space: pre-wrap; max-width: min(620px, 85%); font: 400 1rem/1.65 var(--serif);
}
.msg.bot { background: var(--card); backdrop-filter: blur(12px); box-shadow: 0 8px 30px rgba(0, 0, 0, 0.35); border: 1px solid var(--rule); border-radius: 4px 14px 14px 14px; padding: 12px 16px; }
.status { color: var(--mist); font-size: 0.82rem; font-style: italic; }
.status::before { content: ""; display: inline-block; width: 8px; height: 8px; margin-right: 8px; border-radius: 50%;
  background: var(--gold); animation: pulse 1s infinite alternate; }
@keyframes pulse { from { opacity: 0.25; } to { opacity: 1; } }
.err { color: var(--bad); }
.md > :first-child { margin-top: 0; }
.md > :last-child { margin-bottom: 0; }
.md h1, .md h2, .md h3, .md h4 { color: var(--navy); font-size: 1rem; margin: 1em 0 0.4em; text-transform: none; letter-spacing: 0; }
.md p { margin: 0.5em 0; }
.md ul, .md ol { margin: 0.4em 0; padding-left: 1.4em; }
.md blockquote { margin: 4px 0 8px; padding: 4px 12px; border-left: 3px solid var(--gold); color: var(--steel); font-size: 0.9em; }
.md code { background: var(--side); padding: 1px 5px; border-radius: 4px; font-size: 0.88em; }
.md a { color: var(--gold); }
/* Citations are small page chips so the sentence reads straight through (full filename on hover). */
.md a.cite {
  display: inline-block; margin: 0 2px; padding: 0 7px; border: 1px solid var(--rule); border-radius: 999px;
  background: rgba(255, 255, 255, 0.05); color: var(--mist); font: 500 0.66rem/1.6 Inter, "Segoe UI", sans-serif;
  text-decoration: none; white-space: nowrap; vertical-align: 0.12em; transition: color 0.15s, border-color 0.15s;
}
.md a.cite:hover { color: var(--navy); border-color: rgba(217, 102, 31, 0.5); }
.md li + li { margin-top: 0.45em; }
.md td a.cite { margin: 1px 2px 1px 0; }
/* Guideline feel: bold-only lines become ruled section labels, "Term: rule" bullets become a two-column
   sheet like the NDM matrices, the opening line reads as the summary. Tables are left as they were. */
.md > p:first-child:not(:only-child) { color: var(--ink); padding-bottom: 0.7em; border-bottom: 1px solid var(--rule); }
.md .sec { display: flex; align-items: center; gap: 10px; margin: 1.3em 0 0.5em; color: var(--navy);
  font: 600 0.78rem/1.3 "Barlow Condensed", "Arial Narrow", sans-serif; letter-spacing: 0.16em; text-transform: uppercase; }
.md .sec::after { content: ""; flex: 1; border-top: 1px solid var(--rule); }
.md ul { list-style: square; }
.md li::marker { color: var(--navy); }
.md ul:has(> li.row) { list-style: none; padding-left: 0; border-bottom: 1px solid var(--rule); }
.md li.row { display: grid; grid-template-columns: minmax(7.5em, 32%) 1fr; grid-template-rows: auto 1fr; gap: 2px 18px; margin: 0;
  padding: 9px 0; border-top: 1px solid var(--rule); }
.md li.row + li.row { margin-top: 0; }
.md li.row > .term { grid-row: span 2; font-weight: 600; color: var(--ink); }
.md li.row > .def, .md li.row > ul, .md li.row > ol { grid-column: 2; }
.md li.row > ul, .md li.row > ol { margin: 0.3em 0 0; padding-left: 1.1em; border: 0; }
.md li.row li + li { margin-top: 0.25em; }
@media (max-width: 760px) { .md li.row { grid-template-columns: 1fr; } .md li.row > * { grid-column: 1 !important; grid-row: auto !important; } }
.tbl { overflow-x: auto; margin: 0.6em 0; }
.md table { border-collapse: collapse; font-size: 0.88rem; }
.md th, .md td { border: 1px solid var(--rule); padding: 5px 9px; text-align: left; vertical-align: top; }
.md th { background: var(--side); font-weight: 600; }
details.src { margin-top: 12px; border-top: 1px solid var(--rule); padding-top: 8px; font-size: 0.85rem; }
details.src summary { cursor: pointer; color: var(--steel); }
.srcitem { margin: 10px 0; }
.srcitem blockquote {
  margin: 4px 0 0; padding: 8px 12px; border-left: 3px solid var(--gold); background: var(--side);
  white-space: pre-wrap; font-size: 0.78rem; color: var(--steel); border-radius: 0 4px 4px 0;
}
/* One rounded box holding the question and a round send arrow, like Claude's input. */
form { padding: 8px max(32px, calc((100% - 780px) / 2)) 20px; }
.composer {
  display: flex; align-items: flex-end; gap: 10px; padding: 12px 12px 12px 18px;
  border: 1px solid rgba(200, 204, 210, 0.16); border-radius: 20px; background: rgba(255, 255, 255, 0.04);
  backdrop-filter: blur(12px); box-shadow: 0 8px 30px rgba(0, 0, 0, 0.35);
}
.composer:focus-within { border-color: rgba(217, 102, 31, 0.55); }
textarea {
  flex: 1; resize: none; min-height: 52px; max-height: 220px; padding: 4px 0; border: 0; background: transparent;
  font: 400 1rem/1.6 var(--serif); outline: none;
}
textarea::placeholder { color: var(--mist); }
select:focus { outline: 2px solid color-mix(in srgb, var(--gold) 50%, transparent); outline-offset: 0; }
.send { flex: none; width: 36px; height: 36px; padding: 0; border: 0; border-radius: 50%; background: var(--navy);
  color: #fff; cursor: pointer; display: grid; place-items: center; }
.send svg { width: 18px; height: 18px; }
.send:disabled { opacity: 0.5; cursor: default; }

/* Guideline panel: citations open the PDF here, beside the chat, like Claude's artifact panel. */
#viewer {
  flex: none; width: 0; height: 100vh; overflow: hidden; display: flex; flex-direction: column;
  background: var(--side); backdrop-filter: blur(18px); border-left: 1px solid transparent;
  transition: width 0.28s ease, border-color 0.28s;
}
/* As wide as it can be while the chat keeps 560px beside the 280px sidebar: 600px on a 1440 screen, 820 on 1920. */
body.viewing #viewer { width: clamp(380px, 100vw - 840px, 820px); border-left-color: var(--rule); }
.vbar { display: flex; align-items: center; gap: 10px; padding: 14px 14px 12px 18px; border-bottom: 1px solid var(--rule);
  min-width: 320px; }
.vtitle { flex: 1; min-width: 0; }
.vtitle b { display: block; font: 600 0.9rem/1.3 var(--serif); color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.vtitle span { font-size: 0.72rem; color: var(--mist); }
.vbtn { flex: none; width: 32px; height: 32px; display: grid; place-items: center; border-radius: 8px; cursor: pointer;
  border: 1px solid var(--rule); background: var(--card); color: var(--steel); text-decoration: none; }
.vbtn:hover { color: var(--navy); border-color: rgba(217, 102, 31, 0.5); }
.vbtn svg { width: 16px; height: 16px; }
#viewer iframe { flex: 1; width: 100%; min-width: 320px; border: 0; background: #2a2f33; }
/* Pages drawn by PDF.js: one white sheet per page, stacked, drawn only when scrolled near. */
#vpages { position: relative; flex: 1; min-width: 320px; overflow: auto; padding: 16px 12px 40px; outline: none;
  scrollbar-width: thin; scrollbar-color: rgba(200, 204, 210, 0.2) transparent; }
#vpages[hidden] { display: none; }
.vpg { position: relative; margin: 0 auto 14px; background: #fff; border-radius: 3px;
  box-shadow: 0 6px 24px rgba(0, 0, 0, 0.5); }
.vpg canvas { display: block; width: 100%; height: 100%; border-radius: 3px; }
.vpg .num { position: absolute; right: 8px; bottom: -18px; font-size: 0.66rem; color: var(--mist); }
/* The lines the answer cites: a soft orange marker, pulsing once when it lands. */
.vhl { position: absolute; border-radius: 3px; background: rgba(217, 102, 31, 0.28);
  box-shadow: 0 0 0 1.5px rgba(217, 102, 31, 0.85); mix-blend-mode: multiply; pointer-events: none;
  animation: land 1.2s ease-out 1; }
@keyframes land { 0% { box-shadow: 0 0 0 10px rgba(217, 102, 31, 0); background: rgba(217, 102, 31, 0.55); } }
.vmsg { color: var(--mist); font-size: 0.8rem; text-align: center; padding: 30px 10px; }
.md a.cite.on { color: var(--navy); border-color: var(--navy); background: rgba(217, 102, 31, 0.12); }
/* Below 1600px there isn't room for sidebar, chat and panel together, so the sidebar steps aside while the
   panel is open (Claude does the same with artifacts). Closing the panel brings it back. */
@media (min-width: 761px) and (max-width: 1600px) {
  body.viewing aside { display: none; }
  body.viewing #viewer { width: clamp(380px, 52vw, 860px); }
}

@media (max-width: 760px) {
  /* On a phone the panel covers the screen; the close button brings the chat back. */
  #viewer { position: fixed; inset: 0; z-index: 60; width: 100% !important; height: 100%; transform: translateX(100%);
    transition: transform 0.28s ease; }
  body.viewing #viewer { transform: none; }
  body { flex-direction: column; }
  aside { width: 100%; border-right: 0; border-bottom: 1px solid var(--rule); padding: 14px 16px; gap: 10px; max-height: 45vh; }
  .foot { display: none; }
  main { height: auto; flex: 1; min-height: 0; }
  body { height: 100vh; }
  header, #log, form { padding-left: 16px; padding-right: 16px; }
}
</style>
</head>
<body>
<aside>
  <div class="brand"><img src="logo.png" alt="">
    <div><span class="mark">ASKNICK<span>++</span></span><span class="tag-line">(GUIDELINE ASSISTANT)</span></div></div>
  <hr>
  <div class="label">WHAT DO YOU NEED?</div>
  <div class="modes">
    <label><input type="radio" name="mode" value="ask" checked><b>Guidelines</b><small>How a rule works, what's allowed</small></label>
    <label><input type="radio" name="mode" value="deal"><b>Scenario</b><small>Max LTV for a borrower's scenario</small></label>
    <label class="off"><input type="radio" name="mode" value="pricing" disabled><b>Pricing</b><small>Coming soon</small></label>
  </div>
  <div class="label">PROGRAM</div>
  <select id="program" hidden></select>
  <div class="picker" id="picker">
    <button type="button" class="picker-btn" aria-haspopup="listbox" aria-expanded="false">
      <span class="picker-val">All programs</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
    </button>
    <div class="picker-menu" role="listbox" hidden></div>
  </div>
  <div id="docs" class="docs"></div>
  <div id="docnote" class="note" hidden>Some docs unverified. LTV numbers blocked until they're approved.</div>
  <hr>
  <button class="newchat" id="newchat" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    New chat</button>
  <div id="chats" class="chats"></div>
  <div class="foot"><span id="model"></span><br>by Derrick Garcia</div>
</aside>
<main>
  <header>
    <h1 id="title">Guidelines</h1>
    <div id="subtitle" class="subtitle"></div>
    <div id="offline" class="note">Can't reach AskNick. Start it in PowerShell from the guidebot folder:
      <code>.venv\Scripts\activate; python -m guidebot.server</code> then reload this page.</div>
  </header>
  <div id="log">
    <div class="empty" id="empty"></div>
  </div>
  <form id="ask">
    <div class="composer">
      <textarea id="q" rows="2" placeholder="Ask about a guideline, or give me a scenario"></textarea>
      <button class="send" id="send" aria-label="Send" title="Send (Enter)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
      </button>
    </div>
  </form>
</main>
<section id="viewer" aria-label="Guideline viewer" aria-hidden="true">
  <div class="vbar">
    <div class="vtitle"><b id="vname"></b><span id="vpage"></span></div>
    <button class="vbtn" id="vzoomout" type="button" title="Zoom out" aria-label="Zoom out">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 12h12"/></svg></button>
    <button class="vbtn" id="vzoomin" type="button" title="Zoom in" aria-label="Zoom in">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 6v12M6 12h12"/></svg></button>
    <a class="vbtn" id="vopen" target="_blank" rel="noopener" title="Open in a new tab" aria-label="Open in a new tab">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg></a>
    <button class="vbtn" id="vclose" type="button" title="Close (Esc)" aria-label="Close">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <div id="vpages" tabindex="-1"></div>
  <iframe id="vframe" title="Guideline PDF" hidden></iframe>
</section>
<script src="md.js"></script>
<script src="viewer.js"></script>
<script>
const API = location.protocol === "file:" ? "http://localhost:8600" : "";
const ICON = { verified: "✅", unverified: "⚠️", changed: "🔄" };
const $ = id => document.getElementById(id);
let programs = [], history = [], busy = false;

// ---------- sidebar ----------
// Two choices: the mode (Guidelines or Scenario) and the program (one, or all).
// The server's flags follow from those: a picked program means "read that program", Scenario means "matrix lookup".
// Deal questions go to the matrix lookup in either mode; the server decides that, not this page.
const VIEWS = {
  ask: {
    all: p => ["Guidelines", "Searching the shared guidelines for every program",
      "Ask how a rule works. Pick a program on the left to read just that program's guide."],
    one: p => [`${p} Guidelines`, `Reading the full ${p} guide`, `Ask anything about ${p}: reserves, DTI, credit, property, documentation.`],
    hint: "Ask about a guideline",
  },
  deal: {
    all: p => ["Scenario", "Comparing max LTV across every program",
      "Give me the deal: FICO, loan amount, occupancy, purpose and property type. I'll check every program's matrix."],
    one: p => [`${p} Scenario`, `Max LTV from the ${p} matrix and overlays`,
      `Give me the deal: FICO, loan amount, occupancy, purpose and property type. I'll look it up in the ${p} matrix.`],
    hint: "720 FICO, $650k purchase, primary, SFR",
  },
};
const store = {
  get: k => { try { return localStorage.getItem(k) || ""; } catch { return ""; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch {} },
};
function mode() {
  const m = document.querySelector("input[name=mode]:checked").value, choice = $("program").value;
  return { m, choice, program: !!choice, scenario: m === "deal" };
}
function renderSidebar() {
  const { m, choice } = mode();
  const fam = programs.find(x => x.name === choice)?.family;
  let [title, sub, empty] = choice ? VIEWS[m].one(choice) : VIEWS[m].all();
  if (fam) sub = `${fam.join(" and ")}, side by side`;
  $("title").textContent = title;
  $("subtitle").textContent = sub;
  document.title = `${title} · AskNick`;
  if ($("empty")) $("empty").textContent = empty;
  $("q").placeholder = VIEWS[m].hint;
  // Plain text on the button (no tag pill), so it truncates cleanly in the narrow sidebar.
  document.querySelector("#picker .picker-val").innerHTML =
    choice ? esc(choice.replace(/ \(Express \+ Ignite\)$/, " · Express + Ignite")) : "All programs";
  store.set("mode", m); store.set("program", choice);
  const p = programs.find(x => x.name === choice);
  $("docs").innerHTML = p ? p.docs.map(d => `<span>${ICON[d.status] || ""} ${esc(d.file)}${d.shared ? " (shared)" : ""}</span>`).join("")
    + p.duplicates.map(([a]) => `<span>↳ skipping ${esc(a)} (duplicate)</span>`).join("") : "";
  $("docnote").hidden = !(p && p.docs.some(d => d.status !== "verified"));
}
// Program list grouped the way the products are sold. NonQM opens with the Express + Ignite picks (p.family),
// then each program on its own. A new folder that fits none of them shows under "Other".
const GROUPS = [
  ["Conventional", p => /^conventional/i.test(p.name)],
  ["Government", p => /^(fha|va|usda)\b/i.test(p.name)],
  ["NonQM", p => !!p.family || /^(express|ignite)\b/i.test(p.name)],
  ["Other", p => !p.family && !/^(conventional|fha|va|usda|express|ignite)\b/i.test(p.name)],
];
async function loadPrograms() {
  try {
    const r = await fetch(API + "/api/programs");
    const data = await r.json();
    programs = data.programs;
    $("model").textContent = "Model: " + data.model;
    const sel = $("program"), keep = sel.value || store.get("program");
    sel.innerHTML = "<option value=''>All programs</option>" + GROUPS.map(([label, test]) => {
      const opts = programs.filter(test).sort((a, b) => !!b.family - !!a.family)
        .map(p => `<option>${esc(p.name)}</option>`).join("");
      if (!opts && label === "Other") return "";
      return `<optgroup label="${label}">${opts || "<option disabled>Coming soon</option>"}</optgroup>`;
    }).join("");
    sel.value = programs.some(p => p.name === keep) ? keep : "";
    buildPicker();
    $("offline").style.display = "none";
  } catch (e) {
    $("offline").style.display = "block";
  }
  renderSidebar();
}
document.querySelectorAll("input[name=mode], #program").forEach(el => el.addEventListener("change", renderSidebar));

// ---------- program picker ----------
// Draws the hidden <select>'s options as a menu. Picking one sets the select and fires its change event,
// so everything else keeps reading $("program").value.
const CHECK = `<svg class="ck" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>`;
function optLabel(name) {
  const m = name.match(/^(.*) \((Express \+ Ignite)\)$/);   // family picks: "1099" plus a tag
  return m ? `${esc(m[1])} <span class="tag">${m[2]}</span>` : esc(name);
}
const picker = { btn: document.querySelector("#picker .picker-btn"), menu: document.querySelector("#picker .picker-menu") };
// The menu lives on <body>: inside the sidebar, its blur makes "fixed" mean "fixed to the sidebar", so the menu was
// clipped and scrolling to the current pick scrolled the sidebar (which closes the menu).
document.body.appendChild(picker.menu);
function reveal(o) {
  const m = picker.menu;
  if (o.offsetTop < m.scrollTop) m.scrollTop = o.offsetTop - 6;
  else if (o.offsetTop + o.offsetHeight > m.scrollTop + m.clientHeight) m.scrollTop = o.offsetTop + o.offsetHeight - m.clientHeight + 6;
}
function buildPicker() {
  const opt = o => o.disabled ? `<div class="picker-opt off">${esc(o.textContent)}</div>`
    : `<div class="picker-opt" role="option" data-value="${esc(o.value)}">${o.value ? optLabel(o.value) : "All programs"}${CHECK}</div>`;
  picker.menu.innerHTML = [...$("program").children].map(el => el.tagName === "OPTGROUP"
    ? `<div class="picker-group">${esc(el.label)}</div>` + [...el.children].map(opt).join("") : opt(el)).join("");
}
function pickerOpts() { return [...picker.menu.querySelectorAll(".picker-opt:not(.off)")]; }
function openPicker() {
  const r = picker.btn.getBoundingClientRect(), below = innerHeight - r.bottom - 16;
  Object.assign(picker.menu.style, { left: r.left + "px", minWidth: r.width + "px", width: "max-content",
    top: r.bottom + 6 + "px", maxHeight: Math.max(below, 200) + "px" });
  pickerOpts().forEach(o => {
    const on = o.dataset.value === $("program").value;
    o.classList.toggle("sel", on); o.classList.toggle("active", on); o.setAttribute("aria-selected", on);
  });
  picker.menu.hidden = false;
  picker.btn.setAttribute("aria-expanded", "true");
  const cur = picker.menu.querySelector(".sel");
  if (cur) reveal(cur);
}
function closePicker() { picker.menu.hidden = true; picker.btn.setAttribute("aria-expanded", "false"); }
function choose(v) {
  $("program").value = v;
  $("program").dispatchEvent(new Event("change"));
  closePicker(); picker.btn.focus();
}
picker.btn.addEventListener("click", () => picker.menu.hidden ? openPicker() : closePicker());
picker.menu.addEventListener("click", e => { const o = e.target.closest(".picker-opt:not(.off)"); if (o) choose(o.dataset.value); });
picker.menu.addEventListener("mousemove", e => {
  const o = e.target.closest(".picker-opt:not(.off)");
  if (o) pickerOpts().forEach(x => x.classList.toggle("active", x === o));
});
document.addEventListener("click", e => { if (!e.target.closest("#picker, .picker-menu")) closePicker(); });
addEventListener("resize", closePicker);
document.querySelector("aside").addEventListener("scroll", closePicker);
picker.btn.addEventListener("keydown", e => {
  const opts = pickerOpts(), i = opts.findIndex(o => o.classList.contains("active"));
  if (picker.menu.hidden) {
    if (["ArrowDown", "ArrowUp", "Enter", " "].includes(e.key)) { e.preventDefault(); openPicker(); }
    return;
  }
  if (e.key === "Escape" || e.key === "Tab") return closePicker();
  if (e.key === "Enter" || e.key === " ") { e.preventDefault(); if (opts[i]) choose(opts[i].dataset.value); return; }
  const step = { ArrowDown: 1, ArrowUp: -1 }[e.key];
  if (!step) return;
  e.preventDefault();
  const next = opts[Math.min(Math.max(i + step, 0), opts.length - 1)];
  opts.forEach(o => o.classList.toggle("active", o === next));
  reveal(next);
});
const saved = document.querySelector(`input[name=mode][value="${store.get("mode")}"]:not(:disabled)`);
if (saved) saved.checked = true;

// ---------- chat ----------
function addMsg(role, html) {
  $("empty")?.remove();
  const d = document.createElement("div");
  d.className = "msg " + role;
  d.innerHTML = html;
  $("log").appendChild(d);
  $("log").scrollTop = $("log").scrollHeight;
  return d;
}
function sourcesHtml(src) {
  return `<details class="src"><summary>Sources (${src.length})</summary>` + src.map(s => {
    const head = s.section ? `<strong>§${esc(s.section)} ${esc(s.section_title)}</strong> · ${esc(s.file)} (${esc(s.loc)})`
      : `<strong>${s.program ? esc(s.program) + " | " : ""}${esc(s.file)}</strong> ${esc(s.loc)}`;
    const pg = (String(s.loc).match(/\d+/) || [])[0];
    const link = /\.pdf$/i.test(s.file) && pg ? ` <a href="${API}/pdf/${encodeURIComponent(s.file)}#page=${pg}" target="_blank">open PDF</a>` : "";
    const body = s.text.split("\n").filter(l => !l.startsWith("[")).join("\n").trim();
    return `<div class="srcitem">${head}${link}${body ? `<blockquote>${esc(body)}${s.text.length >= 600 ? "…" : ""}</blockquote>` : ""}</div>`;
  }).join("") + "</details>";
}
async function stream(url, payload, box) {
  let text = "", status = "", sources = [], buf = "";
  const draw = () => {
    box.innerHTML = `<div class="md">${md(text)}</div>` + (status ? `<div class="status">${esc(status)}</div>` : "")
      + (sources.length ? sourcesHtml(sources) : "");
    $("log").scrollTop = $("log").scrollHeight;
  };
  const r = await fetch(API + url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || r.statusText);
  const reader = r.body.getReader(), dec = new TextDecoder();
  for (;;) {
    const { value, done } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    let nl;
    while ((nl = buf.indexOf("\n")) >= 0) {
      const ev = JSON.parse(buf.slice(0, nl)); buf = buf.slice(nl + 1);
      if (ev.text !== undefined) { text += ev.text; status = ""; }
      if (ev.replace !== undefined) { text = ev.replace; status = ""; }
      if (ev.status !== undefined) status = ev.status;
      if (ev.sources) sources = ev.sources;
      if (ev.error) throw new Error(ev.error);
      draw();
    }
  }
  status = ""; draw();
  return text;
}
function setBusy(b) {
  busy = b;
  $("send").disabled = b;
}

// ---------- chat history (saved by the server per signed-in person; this only lists and reopens) ----------
let chatId = null;
const newId = () => crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2);
function whenLabel(ts) {
  const day = d => new Date(d).setHours(0, 0, 0, 0), diff = (day(Date.now()) - day(ts * 1000)) / 864e5;
  return diff < 1 ? "Today" : diff < 2 ? "Yesterday" : diff < 7 ? "This week" : "Earlier";
}
async function loadChats() {
  let chats = [];
  try { chats = (await (await fetch(API + "/api/chats")).json()).chats || []; } catch { return; }
  let last = "";
  $("chats").innerHTML = chats.map(c => {
    const w = whenLabel(c.updated), head = w !== last ? `<div class="when">${w}</div>` : "";
    last = w;
    return head + `<div class="chat-item${c.id === chatId ? " on" : ""}" data-id="${esc(c.id)}" title="${esc(c.title)}">
      <span class="t">${esc(c.title)}</span><button class="x" type="button" aria-label="Delete chat" title="Delete">×</button></div>`;
  }).join("");
}
$("chats").addEventListener("click", async e => {
  const item = e.target.closest(".chat-item");
  if (!item || busy) return;
  if (e.target.closest(".x")) {
    if (!confirm("Delete this chat?")) return;
    await fetch(API + "/api/chats/delete", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ id: item.dataset.id }) });
    if (item.dataset.id === chatId) $("newchat").click(); else loadChats();
    return;
  }
  openChat(item.dataset.id);
});
async function openChat(id) {
  const r = await fetch(API + "/api/chats/" + encodeURIComponent(id));
  if (!r.ok) return loadChats();
  const c = await r.json();
  chatId = c.id;
  history = c.messages.map(m => ({ role: m.role, content: m.content }));
  // Follow-ups go to the same mode and program the chat was in.
  const radio = document.querySelector(`input[name=mode][value="${c.mode === "scenario" ? "deal" : "ask"}"]`);
  if (radio) radio.checked = true;
  if ([...$("program").options].some(o => o.value === c.program)) $("program").value = c.program;
  $("log").innerHTML = "";
  for (const m of c.messages) {
    if (m.role === "user") addMsg("user", esc(m.content));
    else addMsg("bot", `<div class="md">${md(m.content)}</div>` + (m.sources.length ? sourcesHtml(m.sources) : ""));
  }
  renderSidebar();
  loadChats();
}
$("ask").addEventListener("submit", async e => {
  e.preventDefault();
  const question = $("q").value.trim();
  if (!question || busy) return;
  const { program, scenario, choice } = mode();
  $("q").value = ""; $("q").style.height = "";
  addMsg("user", esc(question));
  const box = addMsg("bot", `<div class="status">Thinking…</div>`);
  setBusy(true);
  chatId = chatId || newId();
  try {
    const answer = await stream("/api/chat", { question, history, program: choice, mode_program: program,
                                               mode_scenario: scenario, chat_id: chatId }, box);
    history.push({ role: "user", content: question }, { role: "assistant", content: answer });
    loadChats();
  } catch (err) {
    box.innerHTML = `<div class="err">Something went wrong: ${esc(err.message)}</div>`;
    loadPrograms();
  }
  setBusy(false);
  $("q").focus();
});
$("q").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("ask").requestSubmit(); }
});
$("q").addEventListener("input", e => { e.target.style.height = ""; e.target.style.height = e.target.scrollHeight + "px"; });
$("newchat").addEventListener("click", () => {
  if (busy) return;
  history = []; chatId = null;
  $("log").innerHTML = `<div class="empty" id="empty"></div>`;
  renderSidebar();
  loadChats();
  $("q").focus();
});
// ---------- guideline panel (ui/viewer.js) ----------
// Citation chips and source links open the PDF at that page in the right-hand panel, with the cited lines
// marked. Ctrl/Cmd/Shift-click still opens a new tab.
$("log").addEventListener("click", e => {
  const link = e.target.closest('a[href*="/pdf/"]');
  if (!link || e.ctrlKey || e.metaKey || e.shiftKey || e.button !== 0) return;
  e.preventDefault();
  openGuideline(link);
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && document.body.classList.contains("viewing") && picker.menu.hidden) closeViewer();
});

loadPrograms();
loadChats();
</script>
</body>
</html>
