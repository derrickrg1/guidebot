<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AskNICK</title>
<link rel="icon" href="/logo.png?v=6">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500;6..96,600&family=Lato:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* A shared answer (shares.py): the question, the answer and its citation chips, as they were shown. Same theme as
   guidebot.html. Chips open the PDF in a new tab. */
:root {
  color-scheme: dark;
  --ink: #e6e8ea; --steel: #b3b9be; --mist: #7d878c; --navy: #e3c27a; --rule: rgba(200, 204, 210, 0.1);
  --page: #131c1e; --card: rgba(0, 0, 0, 0.38); --user: rgba(192, 143, 44, 0.1);
}
* { box-sizing: border-box; }
html { background: radial-gradient(ellipse 70% 60% at 55% 35%, rgba(0,0,0,0.15), rgba(0,0,0,0.7) 75%, rgba(0,0,0,0.88)), var(--page);
  background-attachment: fixed; }
body { margin: 0; color: var(--ink); font: 15px/1.6 Lato, "Segoe UI", "Helvetica Neue", Arial, sans-serif; background: transparent; }
main { max-width: 820px; margin: 0 auto; padding: 24px 16px 60px; }
header { display: flex; align-items: center; gap: 12px; margin-bottom: 22px; }
header img { width: 44px; height: 44px; }
header .mark { font: 500 1.5rem/1 "Bodoni Moda", Didot, serif; color: #c8ccd2; letter-spacing: 0.04em; }
header .mark span { color: var(--navy); }
.meta { color: var(--mist); font-size: 0.8rem; margin-bottom: 14px; }
.q { background: var(--user); border: 1px solid rgba(192, 143, 44, 0.35); border-radius: 12px; padding: 12px 16px; margin-bottom: 14px;
  white-space: pre-wrap; }
.a { background: var(--card); border: 1px solid var(--rule); border-radius: 12px; padding: 16px 18px; overflow-x: auto; }
.md table { border-collapse: collapse; margin: 10px 0; font-size: 0.92em; }
.md th, .md td { border: 1px solid var(--rule); padding: 5px 9px; text-align: left; }
.md h1, .md h2, .md h3, .md h4 { color: var(--navy); font-size: 1em; margin: 1em 0 0.4em; }
.md a { color: var(--navy); }
.md > :first-child { margin-top: 0; } .md > :last-child { margin-bottom: 0; }
.md p.hero strong:first-child { display: block; font: 600 1.9em/1.1 "Bodoni Moda", Didot, serif; color: var(--navy); margin-bottom: 4px; }
.note { color: var(--mist); font-size: 0.78rem; margin-top: 16px; }
.err { color: #e08080; }
</style>
</head>
<body>
<main>
  <header><img src="/logo.png" alt=""><span class="mark">Ask<span>NICK</span></span></header>
  <div id="out"><div class="meta">Loading…</div></div>
</main>
<script src="/md.js"></script>
<script>
const API = "";
const $ = id => document.getElementById(id);
const ATT = "\n\n[Attachment: ";
(async () => {
  const token = location.pathname.split("/").pop();
  try {
    const r = await fetch("/api/share/" + encodeURIComponent(token));
    const s = await r.json();
    if (!r.ok) throw new Error(s.error || r.statusText);
    const q = s.question.split(ATT)[0];
    const who = s.by === "local" ? "" : ` by ${esc(s.by.replace(/@.*/, ""))}`;
    $("out").innerHTML = `<div class="meta">Shared${who} · ${new Date(s.ts * 1000).toLocaleString()}${s.program ? " · " + esc(s.program) : ""}</div>
      <div class="q">${esc(q)}</div><div class="a md">${md(s.answer)}</div>
      <div class="note">AskNICK is a fast way to find the rule, not the final word. Check the cited page before you rely on it.</div>`;
    const p = document.querySelector(".a > p"), st = p && p.firstElementChild;
    if (st && st.tagName === "STRONG" && /^(Max LTV\/CLTV|Best fit):\s*\d/.test(st.textContent)) p.classList.add("hero");
    document.querySelectorAll('a[href*="/pdf/"]').forEach(a => { a.target = "_blank"; a.rel = "noopener"; });
  } catch (e) {
    $("out").innerHTML = `<div class="err">${esc(e.message)}</div>`;
  }
})();
</script>
</body>
</html>
